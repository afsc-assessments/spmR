# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-22.04
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Install pinned ADMB 13.2
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/admb-project/admb/releases/download/admb-13.2/admb-13.2-linux.zip -o "$RUNNER_TEMP/admb.zip"
          echo 'd4770e85f5c8802f5adb33ba1c6fe726ca050cda1a32a6acea35ad840615707b  '"$RUNNER_TEMP/admb.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/admb.zip" -d "$RUNNER_TEMP/admb"
          echo "$RUNNER_TEMP/admb/admb/bin" >> "$GITHUB_PATH"

      - name: Compile projection engine for worked examples
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/spm-build"
          cp inst/admb/spm.tpl "$RUNNER_TEMP/spm-build/"
          cd "$RUNNER_TEMP/spm-build"
          admb -f spm.tpl 2>&1 | tee compile.log
          if grep -Ei 'warning:|error:' compile.log; then exit 1; fi
          ./spm -spmr-capabilities | grep -Fx 'SPMR_INPUT_FORMAT=2'
          echo "SPMR_EXECUTABLE=$RUNNER_TEMP/spm-build/spm" >> "$GITHUB_ENV"
          echo "SPMR_RUN_GT20=true" >> "$GITHUB_ENV"

      - name: Build site
        run: |
          pkgdown::build_site_github_pages(
            clean = TRUE,
            install = FALSE,
            lazy = FALSE,
            new_process = FALSE
          )
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
